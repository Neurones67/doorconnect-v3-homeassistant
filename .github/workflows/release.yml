name: Release

on:
  release:
    types: [published]

jobs:
  check-version:
    name: Tag matches manifest version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(jq -r .version custom_components/doorconnect_v3/manifest.json)
          echo "tag=$tag manifest=$version"
          test "$tag" = "$version" || { echo "::error::Release tag $GITHUB_REF_NAME does not match manifest version $version"; exit 1; }
